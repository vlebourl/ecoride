# Signed Android APK, published as a GitHub release.
#
# Manual on purpose: the app loads the deployed site (server.url), so web
# changes reach it without a new APK. A release is only needed when native code
# changes (plugins, Java/Kotlin, manifest, Capacitor upgrade).
#
# Run: gh workflow run android-release.yml
#
# Secrets (repository → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Losing the keystore means installed apps can never be updated: keep the
# backup described in docs/architecture/capacitor-android.md.
name: Android release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # Applies patches/ (bluetooth-le without MTU request).
      - run: bun install --frozen-lockfile

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="android-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Merge a version bump first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # Guard: requirement #1 of the native BLE transport (no MTU request).
      - name: Native BLE guard
        working-directory: client
        run: bunx vitest run src/lib/__tests__/native-no-mtu-request.test.ts

      # webDir must exist for cap sync; the sync also writes the social-login
      # provider flags (Google only) into the plugin's gradle.properties.
      - name: Build web assets and sync Capacitor
        working-directory: client
        run: |
          bunx vite build
          bunx cap sync android

      - name: Build signed release APK
        working-directory: client/android
        env:
          ECORIDE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ECORIDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ECORIDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ECORIDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ECORIDE_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ECORIDE_KEYSTORE_FILE"

      - name: Verify signature
        id: apk
        run: |
          apk=client/android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::APK is debug-signed"
            exit 1
          fi
          out="ecoride-${{ steps.version.outputs.version }}.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha1=$(grep -m1 'SHA-1 digest' signature.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.apk.outputs.file }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT_SHA1: ${{ steps.apk.outputs.sha1 }}
        run: |
          cat > notes.md <<NOTES
          APK Android ecoRide ${VERSION}, signé release.

          - SHA-256 : \`${SHA256}\`
          - Certificat (SHA-1) : \`${CERT_SHA1}\`

          **Installation** : sur le téléphone, ouvrez cette page, téléchargez \`${FILE}\` puis ouvrez-le. Autorisez l'installation d'applis inconnues pour Chrome ou Fichiers.

          Une version **debug** installée doit être désinstallée d'abord : la signature est différente et Android refuse la mise à jour.
          NOTES
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "Android ${VERSION}" --notes-file notes.md
