name: Auto-bump version

on:
  push:
    branches: [main]

permissions: {}

# Serialize the version push, CI gate and deployment as one unit.
concurrency:
  group: ecoride-production-deploy
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    # Skip if the commit is already a version bump (prevent infinite loop)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PAT with repo scope (owner token) — GITHUB_TOKEN cannot push directly
          # to a protected branch. Owner token bypasses branch protection when
          # enforce_admins is false.
          token: ${{ secrets.GH_PAT }}

      - name: Determine bump type from commit message
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Check for BREAKING CHANGE in commit body or footer (major bump)
          if echo "$COMMIT_MSG" | grep -qP '(BREAKING CHANGE|BREAKING-CHANGE)'; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            # Extract type from conventional commit (first line only)
            TYPE=$(echo "$COMMIT_MSG" | head -1 | grep -oP '^(feat|fix|perf|refactor)' || echo "")

            if [ "$TYPE" = "feat" ]; then
              echo "type=minor" >> $GITHUB_OUTPUT
            elif [ "$TYPE" = "fix" ] || [ "$TYPE" = "perf" ] || [ "$TYPE" = "refactor" ]; then
              echo "type=patch" >> $GITHUB_OUTPUT
            else
              echo "type=none" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Commit type: $(cat $GITHUB_OUTPUT | grep type= | cut -d= -f2)"

      - name: Bump package.json version
        if: steps.bump.outputs.type != 'none'
        run: |
          BUMP="${{ steps.bump.outputs.type }}"
          CURRENT=$(node -p "require('./package.json').version")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping: $CURRENT → $NEW ($BUMP)"

          # Update package.json
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$NEW';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $NEW"
          git push

      - name: Record the main commit to deploy
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci-gate:
    name: Wait for main CI
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require successful CI for the deployment SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.bump.outputs.target_sha }}
        run: node scripts/wait-for-main-ci.mjs

  deploy:
    name: Deploy to Coolify
    needs: [bump, ci-gate]
    runs-on: homelab-runner
    permissions:
      contents: read
    steps:
      - name: Verify main still points to the tested SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.bump.outputs.target_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "main moved from tested SHA $TARGET_SHA to $MAIN_SHA; refusing deployment" >&2
            exit 1
          fi
      - name: Trigger Coolify deploy
        run: |
          RESPONSE=$(curl -s -f -X GET \
            "http://localhost:8000/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "$RESPONSE"
          DEPLOY_UUID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['deployments'][0]['deployment_uuid'])")
          echo "deploy_uuid=$DEPLOY_UUID" >> $GITHUB_ENV

      - name: Wait and verify
        run: |
          echo "Waiting for deployment ${{ env.deploy_uuid }} to finish..."
          for i in $(seq 1 24); do
            sleep 15
            STATUS=$(curl -s \
              "http://localhost:8000/api/v1/deployments/${{ env.deploy_uuid }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('status'))")
            echo "[$((i * 15))s] Status: $STATUS"
            [ "$STATUS" = "finished" ] && exit 0
            [ "$STATUS" = "failed" ] && echo "Deployment failed!" && exit 1
          done
          echo "Timeout: deployment still $STATUS after 360s"
          exit 1
