name: Auto-bump version

on:
  push:
    branches: [main]

permissions: {}

# Serialize the version pushes. Production deployments follow the main CI separately.
concurrency:
  group: ecoride-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip if the commit is already a version bump (prevent infinite loop)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PAT with repo scope (owner token) — GITHUB_TOKEN cannot push directly
          # to a protected branch. Owner token bypasses branch protection when
          # enforce_admins is false.
          token: ${{ secrets.GH_PAT }}

      - name: Determine bump type from commit message
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Check for BREAKING CHANGE in commit body or footer (major bump)
          if echo "$COMMIT_MSG" | grep -qP '(BREAKING CHANGE|BREAKING-CHANGE)'; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            # Extract type from conventional commit (first line only). A GitHub
            # merge commit carries the PR title as the first line of its body.
            SUBJECT=$(echo "$COMMIT_MSG" | head -1)
            if echo "$SUBJECT" | grep -q '^Merge pull request '; then
              SUBJECT=$(echo "$COMMIT_MSG" | sed -n '2,${/./{p;q;};}')
            fi
            TYPE=$(echo "$SUBJECT" | grep -oP '^(feat|fix|perf|refactor)' || echo "")

            if [ "$TYPE" = "feat" ]; then
              echo "type=minor" >> $GITHUB_OUTPUT
            elif [ "$TYPE" = "fix" ] || [ "$TYPE" = "perf" ] || [ "$TYPE" = "refactor" ]; then
              echo "type=patch" >> $GITHUB_OUTPUT
            else
              echo "type=none" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Commit type: $(cat $GITHUB_OUTPUT | grep type= | cut -d= -f2)"

      - name: Bump package.json version
        if: steps.bump.outputs.type != 'none'
        run: |
          BUMP="${{ steps.bump.outputs.type }}"
          CURRENT=$(node -p "require('./package.json').version")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping: $CURRENT → $NEW ($BUMP)"

          # Update package.json
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$NEW';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $NEW"
          git push
